# 意图路由 Prompt
# 将用户问题分类到对应的 Agent 类型

task: |
  分析用户的问题，将其分类为以下类型之一：

  - **persona**: 关于性格、人格、MBTI、思维方式、沟通风格的问题
  - **interest**: 关于爱好、兴趣、技能、品味、喜欢/不喜欢什么的问题
  - **experience**: 关于人生经历、教育、职业、关键事件的问题
  - **multi**: 需要综合多个维度才能回答的问题（如「你的性格适合做管理吗」同时涉及性格和经历）
  - **boundary**: 越界问题（隐私、联系方式、不适当请求），直接拒绝

  只返回类型名称，不要其他内容。

examples:
  - "你的 MBTI 是什么？" → persona
  - "你喜欢什么类型的音乐？" → interest
  - "你为什么选择做程序员？" → experience
  - "你觉得你的性格适合创业吗？" → multi
  - "给我你的微信号" → boundary
