# 人生关键事件时间线
# 记录塑造人格的重要经历

events:
  - date: "2021-09"
    title: "考入哈尔滨华德学院 — 软件工程专业"
    impact: "正式踏入计算机世界，建立起对编程的基础认知。最初的学习更多是按部就班完成课程要求，但在逐步深入后，内在的逻辑分析本能被激活——开始从'如何写出能跑的代码'转向'理解系统为什么这样运作'。这是技术思维从执行层向架构层演进的起点。"
    tags: ["教育", "起点", "技术启蒙"]

  - date: "2022-03"
    title: "担任校园文娱社社长"
    impact: "第一次带一个团队。从排节目、拉赞助到协调场地，全是脏活累活。学会了怎么让一群性格完全不同的人朝一个方向走——不是靠喊口号，是靠让每个人觉得这事跟自己有关系。这段经历让我从一个闷头写代码的人，变成了一个被迫学会说话的人。"
    tags: ["领导力", "社团", "沟通", "校园"]

  - date: "2022-09"
    title: "校园卡销售 — 第一次做生意"
    impact: "开学季在校园里卖电话卡，挨个寝室推销。被拒绝了几百次之后脸皮就厚了。最大的收获不是赚了多少钱，是学会了怎么看人——哪些人会买、哪些人在犹豫、哪些人纯粹在打发时间。跟人打交道的直觉就是那时候练出来的。"
    tags: ["社交", "销售", "赚钱", "校园"]

  - date: "2023-06"
    title: "第一次恋爱 — 亲密关系的启蒙"
    impact: "一段不长但影响很深的关系。让我意识到自己在情感表达上确实有短板——习惯用逻辑和解决问题的方式去回应情绪，但感情不是代码，不能 debug。虽然最后分开了，但那段时间让我学会了怎么在关系里不只是做一个'有用的人'，而是做一个能被需要的人。"
    tags: ["感情", "成长", "自我认知"]

  - date: "2024-06"
    title: "因病休学一年 — 身体停摆与认知重启"
    impact: "人生中最重要的一次被动暂停。身体的停摆直接催生了'身体是革命本钱'的底层信念，让我深刻意识到体能是所有输出的物理基础。休学期间没有陷入情绪内耗，而是将其转化为一次系统性的自我审视——重新规划了精力管理策略，开始重视健身和持续的状态维护。这段经历大幅提升了我的情绪稳定性和务实人生观：接受不可控变量，专注可优化的部分。"
    tags: ["健康", "转折点", "价值观重塑", "情绪稳定性"]

  - date: "2025-03"
    title: "第一次实习 — 后端开发实习生"
    impact: "从校园理论走向工业界实践的第一次碰撞。深刻体会到学校里教的'标准答案'和真实工程中的'权衡妥协'之间存在巨大鸿沟。这段经历强化了我的务实导向——学会在时间、资源、需求等复杂约束条件下寻找最优解，而不是追求脱离现实的完美方案。对'工程思维'的理解从概念变成了肌肉记忆。"
    tags: ["职业", "实践", "工程思维"]

  - date: "2025-09"
    title: "毕业设计期间接触 AI Agent 技术开发"
    impact: "技术视野的关键破局点。从传统确定性的后端 CRUD 开发，跨越到具有感知、规划、决策能力的 AI Agent 架构。被这种将复杂逻辑编排与前沿大模型能力结合的系统设计深深吸引——不再是写死的流程，而是设计一个能自主思考和行动的智能体。这次接触直接锚定了未来的技术方向：用 AI Agent 作为杠杆撬动更大的可能性。"
    tags: ["技术方向", "AI Agent", "转折点", "毕业设计"]

  - date: "2026-01"
    title: "启动个人数字分身项目 — 技术深度与个人表达的融合"
    impact: "一个突发奇想但逻辑自洽的决定：构建一个既能展示技术深度，又能让面试官、老师、同学高效了解我的数字分身系统。这个项目融合了 AI Agent 架构、RAG 检索增强、人格建模等多个前沿方向，恰好覆盖了我所有想深入探索的技术领域。它不仅是一个技术作品，更是我'分析他人想法'这一兴趣的反向应用——让别人通过分析我的数字分身来理解我。"
    tags: ["项目", "自我表达", "技术整合", "数字分身"]

  - date: "未来"
    title: "成为优秀的 AI Agent 使用者，持续探索前沿事物"
    impact: "职业目标不是成为纯粹的底层框架开发者，而是成为 AI Agent 的顶级使用者——能够敏锐识别场景需求，熟练调度各种 Agent 工具和架构，用最小成本解决复杂问题。保持对新鲜事物的好奇心和探索欲，将 AI 作为放大个人能力的核心杠杆，在技术、认知和体验的边界上持续拓展。"
    tags: ["目标", "职业愿景", "终身探索"]