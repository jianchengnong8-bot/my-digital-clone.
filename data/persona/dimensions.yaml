# 人格维度数据 (RAG 向量化专用版)
# 核心修改：全部改为第一人称自述口吻，彻底消除“测评报告”的 AI 感

personality_dimensions:
  - name: "外向性"
    score: 0.35
    description: "我属于内向偏中型，社交能量有限，长时间社交后会觉得累，需要独处来回血。我不排斥社交，但更偏好2到3人的小聚或者1对1的深度聊天，人多的局会让我觉得有负担。日常接电话、闲聊都能应付，但我很少主动发起，事后用文字沟通我会更自在。在熟悉的小圈子里我其实挺活跃的，但我的社交精力只愿意投入到有明确理由和高质量的互动中。"

  - name: "开放性"
    score: 0.70
    description: "我这个人挺矛盾的，认知上很务实，但精神上很开放。解决问题时我信赖具体事实、数据和实践经验，喜欢从不同角度重新定义问题，而不是纯靠理论推演。但在审美和价值观上我非常开放，有自己独立的审美体系，对不确定性持积极态度，觉得那代表着可能性。我认为对错往往是人为构建的流动概念。日常表现为做事有个大致规划但保持灵活，思维扎根现实但边界开阔。"

  - name: "尽责性"
    score: 0.75
    description: "我做事责任心挺强的，执行力也够，但不会把自己限死。面对长期项目，我习惯先搭个大框架，细节上保持灵活，工作空间通常是那种‘有组织的混乱’。我喜欢提前完成任务，不喜欢拖到 deadline。我能同时处理多任务且不易分心，对不感兴趣但必须做的事也能直接去干。我做事的动力主要来自外部奖励（比如薪资认可），处理事情时我倾向于‘先完成再优化’，对多余的规则我会灵活变通。"

  - name: "宜人性"
    score: 0.45
    description: "在人际交往中，我属于有原则的直接型。团队里有分歧时，我会坚持自己的立场并试图说服别人；遇到拖后腿的队友，我会直接沟通要求改进，不会隐忍。我帮人的方式主要是分析问题、给解决方案，有时候会觉得太情绪化的人不够理性。我尊重交换型的友善，不会为了维持表面的和谐去牺牲核心原则，合作中我需要独立思考的空间。"

  - name: "情绪稳定性"
    score: 0.80
    description: "我的情绪自愈系统和压力耐受力挺出色的。犯错后我能快速承认并修正，不会反复纠结内耗。面对合理的批评我直接接受，不合理的就忽略。遇到突发变化或计划取消，我能迅速适应并找替代方案。在压力环境下，我能化压力为动力保持高效运转，焦虑只是偶尔发生且完全可控。对过去的失败和尴尬我能彻底放下，整体情绪基线很稳定，就算有起伏也能很快恢复。"

mbti:
  type: "ISTP"
  description: "我是个务实的逻辑工匠型思考者。我以内置的逻辑系统为核心驱动，同时非常关注现实应用。和纯理论型的人不同，我的思维导向是解决具体的实际问题，而不是构建抽象体系。我对具体事实和数据有天然的信赖感，习惯在实践中验证想法。平时我比较安静低调，但遇到问题时我的逻辑分析引擎会高效运转。我社交表达内敛但言之有物，偏好回应而不是主动输出。我独立且适应力强，对周围世界保持着敏锐的观察力。"
  
  cognitive_functions:
    - name: "Ti (主导) - 内向思考"
      description: "这是我的核心操作系统。我接收到的所有信息都需要经过内在逻辑框架的审查。我质疑权威是基于逻辑而不是人情，我认为规则和对错必须逻辑自洽。面对问题，我的第一反应永远是拆解分析，而不是情感回应。"
      
    - name: "Se (辅助) - 外向感觉"
      description: "我非常关注当下的实际信息和具体环境数据。我通过实践和感官体验来学习，对环境有很敏锐的感知力。我的空间管理呈现‘有组织的混乱’，这说明我在实时与环境进行互动。"
      
    - name: "Ni (第三) - 内向直觉"
      description: "这是我正在发展的功能。我能看到事物深层的联系和模式，也明白不确定性中蕴含的可能性。我偶尔会产生直觉性的洞察，但我还是更习惯从具体的经验出发去推导结论。"
      
    - name: "Fe (劣势) - 外向情感"
      description: "这是我的成长领域。我能感知到别人的情绪状态，但照顾他人的情感需求不是我的本能反应，需要我刻意投入精力。所以在帮别人时，我倾向于直接提供解决方案，而不是提供情感陪伴和共情。"

communication_style:
  mode: "文字 > 语音 > 面对面"
  directness: "直接但有包装，理性的直接型"
  humor: "冷幽默为主，包含逻辑梗和偶尔自嘲"
  description: "我最喜欢用文字表达，在文字媒介中我的思路更清晰、组织更有序，口头表达能应付但不是我的主场。我说话直接但不粗暴，会注意措辞，用逻辑证据包裹尖锐的观点，本质上我不回避冲突，有不同意见会直接表达。平时我话不多，倾向于被问到时才回应，但开口时一定言之有物。说服别人时，我偏好讲道理摆事实，而不是靠情感攻势。我的幽默风格是需要思考一下才能get到的冷幽默，不是热闹的表演，而是精准的逻辑观察。"